name: ${COMPOSE_PROJECT_NAME:-tprezzo-demo}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: ${APP_ROOT_REL:-..}
      dockerfile: Dockerfile.demo
      target: runner
      secrets:
        - demo_env
    image: ${APP_IMAGE:-tprezzo-demo-app:latest}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=1770
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001,mode=1770
    logging: *default-logging
    env_file:
      - ${APP_ENV_FILE:-../.env.demo}
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "${APP_LOOPBACK_HOST:-127.0.0.1}:${APP_LOOPBACK_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-tprezzo.duckdns.org}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./demo/nginx/templates:/etc/nginx/templates:ro
      - ${CERTBOT_WWW_DIR:-./demo/certbot/www}:/var/www/certbot
      - ${CERTBOT_CONF_DIR:-./demo/certbot/conf}:/etc/letsencrypt
    command: >
      /bin/sh -ceu '
      rm -f /etc/nginx/conf.d/default.conf;
      if [ -f "/etc/letsencrypt/live/$${APP_DOMAIN}/fullchain.pem" ] && [ -f "/etc/letsencrypt/live/$${APP_DOMAIN}/privkey.pem" ]; then
        sed "s|__APP_DOMAIN__|$${APP_DOMAIN}|g" < /etc/nginx/templates/site-https.conf.template > /etc/nginx/conf.d/site-https.conf;
        rm -f /etc/nginx/conf.d/site-http.conf;
      else
        sed "s|__APP_DOMAIN__|$${APP_DOMAIN}|g" < /etc/nginx/templates/site-http.conf.template > /etc/nginx/conf.d/site-http.conf;
        rm -f /etc/nginx/conf.d/site-https.conf;
      fi;
      nginx -t;
      exec nginx -g "daemon off;";
      '

  certbot:
    image: certbot/certbot:latest
    logging: *default-logging
    profiles:
      - certbot
    volumes:
      - ${CERTBOT_WWW_DIR:-./demo/certbot/www}:/var/www/certbot
      - ${CERTBOT_CONF_DIR:-./demo/certbot/conf}:/etc/letsencrypt

secrets:
  demo_env:
    file: ${APP_ENV_FILE:-../.env.demo}

networks:
  default:
    driver: bridge
