services:
 
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: tprezzo-stripe-cli
    restart: unless-stopped
    profiles:
      - stripe
    command:
      - listen
      - --forward-to
      - ${STRIPE_WEBHOOK_FORWARD_TO:-http://host.docker.internal:8080/api/v1/stripe/webhook}
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_succeeded,invoice.payment_failed
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  storage_data:
