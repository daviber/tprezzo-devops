user nginx;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 25m;

  # Omit query strings: Auth callback parameters must not enter access logs.
  log_format structured escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout structured;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # Re-resolve container addresses after an API/frontend replacement.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream java_api {
    zone java_api 64k;
    server api:8080 resolve;
    keepalive 32;
  }
  upstream next_frontend {
    zone next_frontend 64k;
    server frontend:5000 resolve;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
